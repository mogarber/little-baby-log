name: LittleBabyLog

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  BabyLogKit:
    path: Packages/BabyLogKit

targets:
  LittleBabyLog:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: BabyLogKit
    # Bundle id, team, and entitlements come from Config/App.xcconfig (and the
    # git-ignored Config/Local.xcconfig). Do not set them in settings below,
    # target-level settings would override the xcconfig.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_NAME: LittleBabyLog
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Little Baby Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CKSharingSupported: true
        LBLCloudKitContainer: $(CLOUDKIT_CONTAINER)
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false

schemes:
  LittleBabyLog:
    build:
      targets:
        LittleBabyLog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: BabyLogKit/BabyLogKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
